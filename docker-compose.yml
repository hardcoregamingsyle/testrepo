version: '3.8'

services:
  app-dev:
    image: node:22.14.0-alpine
    container_name: secure-app-dev
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:8080
    command: npm run dev -- --host 0.0.0.0 --port 3000
    profiles: ["dev"]
    networks:
      - app-network

  app-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: secure-app-prod
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      - API_ORIGIN=https://api.production.com
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    user: "10001:10001"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - app-network
    profiles: ["prod"]

networks:
  app-network:
    driver: bridge