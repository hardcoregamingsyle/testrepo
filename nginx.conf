server {
    listen 8080;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    # Fix: Nonce-based CSP
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-${CSP_NONCE}'; style-src 'self' 'nonce-${CSP_NONCE}'; img-src 'self' data:; font-src 'self';" always;

    location /api/ {
        proxy_pass http://backend;
        add_header Set-Cookie "SameSite=Strict; Secure; HttpOnly; Path=/;" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    }
    location / { 
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html; 
    }
}