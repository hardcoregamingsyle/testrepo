server {
    listen 8080;
    # Strict CSP enforcing connection to specific API origin
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://api.yourdomain.com; style-src 'self'; script-src 'self'; object-src 'none';" always;
    add_header Set-Cookie "SameSite=Strict; Secure; HttpOnly; Path=/";
    
    location / { 
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html; 
    }
}